<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップウォッチ動画生成</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#000; color:#fff; font-family: ui-monospace, monospace; }
    .wrap { width:min(92vw,960px); display:grid; gap:14px; justify-items:center; }
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
    input, button { font-family:inherit; font-size:16px; border-radius:8px; border:1px solid #666; background:#111; color:#fff; padding:8px 10px; }
    input { width:130px; }
    #startBtn:active { background:#3fb950; border-color:#56d364; }
    #startBtn.running { background:#2ea043; border-color:#56d364; box-shadow:0 0 0 3px rgba(46,160,67,.35); }
    canvas { width:100%; max-width:960px; aspect-ratio:16/9; display:block; border:1px solid #222; background:#000; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <label for="secondsInput">秒数:</label>
      <input id="secondsInput" type="number" min="0.01" step="0.01" value="12.34" />
      <button id="startBtn">スタート</button>
    </div>
    <div id="status">待機中</div>
    <canvas id="timerCanvas" width="1280" height="720" aria-label="タイマー描画"></canvas>
  </div>

  <script>
    const FPS = 60;
    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const secondsInput = document.getElementById('secondsInput');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    function formatTime(seconds) {
      const cs = Math.floor(Math.max(0, seconds) * 100 + 1e-6);
      const m = Math.floor(cs / 6000);
      const s = Math.floor((cs % 6000) / 100);
      const c = cs % 100;
      return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
    }

    function drawTime(seconds) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 180px ui-monospace, monospace';
      ctx.fillText(formatTime(seconds), canvas.width / 2, canvas.height / 2);
    }
    drawTime(0);

    function pickMime() {
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) return 'video/webm;codecs=vp9';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) return 'video/webm;codecs=vp8';
      return 'video/webm';
    }

    async function recordStopwatch(durationSec) {
      const mime = pickMime();
      const stream = canvas.captureStream(FPS);
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };

      const done = new Promise((resolve) => {
        rec.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
      });

      const start = performance.now();
      rec.start();
      statusEl.textContent = '録画中...';

      await new Promise((resolve) => {
        function tick(now) {
          const elapsed = (now - start) / 1000;
          const t = Math.min(durationSec, elapsed);
          drawTime(t);
          if (elapsed >= durationSec) {
            drawTime(durationSec);
            rec.stop();
            resolve();
            return;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });

      return done;
    }

    let busy = false;
    startBtn.addEventListener('click', async () => {
      if (busy) return;
      const durationSec = Number.parseFloat(secondsInput.value);
      if (!Number.isFinite(durationSec) || durationSec <= 0) return alert('0より大きい秒数を入力してください');

      busy = true;
      startBtn.classList.add('running');
      startBtn.textContent = '生成中...';
      statusEl.textContent = '開始しました。準備中...';
      await new Promise((r) => requestAnimationFrame(r));
      startBtn.disabled = true;

      try {
        const blob = await recordStopwatch(durationSec);
        const fileName = `stopwatch_${durationSec.toFixed(2)}s.webm`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = `完了: ${fileName} をダウンロードしました`;
      } catch (e) {
        console.error(e);
        statusEl.textContent = `エラー: ${e.message || e}`;
      } finally {
        busy = false;
        startBtn.disabled = false;
        startBtn.classList.remove('running');
        startBtn.textContent = 'スタート';
      }
    });
  </script>
</body>
</html>
