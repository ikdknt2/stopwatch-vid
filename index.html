<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップウォッチ動画生成（高速オフライン）</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: ui-monospace, monospace; }
    .wrap { width: min(92vw, 960px); display: grid; gap: 14px; justify-items: center; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    input, select, button { font-family: inherit; font-size: 16px; border-radius: 8px; border: 1px solid #666; background: #111; color: #fff; padding: 8px 10px; }
    input[type="text"] { width: 190px; }
    input[type="color"] { width: 54px; height: 40px; padding: 4px; }
    #startBtn:active { background: #3fb950; border-color: #56d364; }
    #startBtn.running { background: #2ea043; border-color: #56d364; box-shadow: 0 0 0 3px rgba(46, 160, 67, .35); }
    canvas { width: 100%; max-width: 960px; aspect-ratio: 16/9; border: 1px solid #222; background: #000; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <label for="secondsInput">秒数:</label>
      <input id="secondsInput" type="text" value="12.34" placeholder="例: 70.24 / 1:10.24" />
      <label for="fpsSelect">FPS:</label>
      <select id="fpsSelect">
        <option value="60">60</option>
        <option value="30">30</option>
      </select>
      <label for="tickSelect">更新刻み:</label>
      <select id="tickSelect">
        <option value="0.01">0.01秒</option>
        <option value="0.1">0.1秒</option>
        <option value="1">1秒</option>
        <option value="10">10秒</option>
      </select>
      <label for="bgColorInput">背景:</label>
      <input id="bgColorInput" type="color" value="#000000" />
      <label for="textColorInput">文字:</label>
      <input id="textColorInput" type="color" value="#ffffff" />
      <button id="startBtn">スタート</button>
    </div>
    <div id="status">待機中</div>
    <canvas id="timerCanvas" width="1280" height="720"></canvas>
  </div>

  <script type="module">
    import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/webm-muxer@5.1.4/+esm';

    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const secondsInput = document.getElementById('secondsInput');
    const startBtn = document.getElementById('startBtn');
    const fpsSelect = document.getElementById('fpsSelect');
    const tickSelect = document.getElementById('tickSelect');
    const bgColorInput = document.getElementById('bgColorInput');
    const textColorInput = document.getElementById('textColorInput');
    const statusEl = document.getElementById('status');

    const workCanvas = document.createElement('canvas');
    workCanvas.width = canvas.width;
    workCanvas.height = canvas.height;
    const workCtx = workCanvas.getContext('2d', { alpha: false });

    function formatTime(seconds) {
      const cs = Math.floor(Math.max(0, seconds) * 100 + 1e-6);
      const m = Math.floor(cs / 6000);
      const s = Math.floor((cs % 6000) / 100);
      const c = cs % 100;
      return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
    }

    function drawTimeOn(targetCtx, seconds, w, h, bgColor, textColor) {
      targetCtx.fillStyle = bgColor;
      targetCtx.fillRect(0, 0, w, h);
      targetCtx.fillStyle = textColor;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.font = 'bold 180px ui-monospace, monospace';
      targetCtx.fillText(formatTime(seconds), w / 2, h / 2);
    }

    function drawTime(seconds, bgColor, textColor) {
      drawTimeOn(ctx, seconds, canvas.width, canvas.height, bgColor, textColor);
    }
    drawTime(0, bgColorInput.value, textColorInput.value);


    function parseDurationInput(raw) {
      const text = String(raw || '').trim();
      if (!text) return NaN;

      // m:ss.cc 形式（例: 1:10.24）
      if (text.includes(':')) {
        const [mPart, sPart] = text.split(':');
        if (sPart === undefined) return NaN;
        const minutes = Number.parseInt(mPart, 10);
        const seconds = Number.parseFloat(sPart);
        if (!Number.isFinite(minutes) || minutes < 0 || !Number.isFinite(seconds) || seconds < 0 || seconds >= 60) return NaN;
        return minutes * 60 + seconds;
      }

      // 秒のみ（例: 70.24）
      return Number.parseFloat(text);
    }

    function quantizeTime(seconds, stepSec) {
      if (!Number.isFinite(stepSec) || stepSec <= 0) return seconds;
      return Math.floor(seconds / stepSec) * stepSec;
    }

    async function generateWebM(durationSec, fps, tickStepSec, bgColor, textColor) {
      if (!('VideoEncoder' in window) || !('VideoFrame' in window)) {
        throw new Error('このブラウザはWebCodecs未対応です（最新Chrome推奨）');
      }

      const dynamicFrameCount = Math.max(0, Math.floor(durationSec * fps));
      const totalFrames = dynamicFrameCount + 1;
      const frameDurationUs = Math.round(1_000_000 / fps);

      const muxer = new Muxer({
        target: new ArrayBufferTarget(),
        video: {
          codec: 'V_VP9',
          width: workCanvas.width,
          height: workCanvas.height,
          frameRate: fps
        }
      });

      let encodedCount = 0;
      const encoder = new VideoEncoder({
        output: (chunk, meta) => {
          muxer.addVideoChunk(chunk, meta);
          encodedCount += 1;
          if (encodedCount % 30 === 0 || encodedCount === totalFrames) {
            statusEl.textContent = `エンコード中... ${encodedCount}/${totalFrames}`;
          }
        },
        error: (e) => { throw e; }
      });

      encoder.configure({
        codec: 'vp09.00.10.08',
        width: workCanvas.width,
        height: workCanvas.height,
        bitrate: 8_000_000,
        framerate: fps
      });

      statusEl.textContent = `フレーム生成中... 0/${totalFrames}`;
      const t0 = performance.now();

      for (let i = 0; i < dynamicFrameCount; i += 1) {
        const t = i / fps;
        const shownTime = quantizeTime(t, tickStepSec);
        drawTimeOn(workCtx, shownTime, workCanvas.width, workCanvas.height, bgColor, textColor);
        const vf = new VideoFrame(workCanvas, { timestamp: i * frameDurationUs, duration: frameDurationUs });
        encoder.encode(vf);
        vf.close();

        if ((i + 1) % 60 === 0 || i + 1 === dynamicFrameCount) {
          const elapsed = (performance.now() - t0) / 1000;
          const speed = ((i + 1) / (elapsed || 1)).toFixed(1);
          statusEl.textContent = `フレーム生成中... ${i + 1}/${totalFrames} (${speed}fps相当)`;
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      drawTimeOn(workCtx, durationSec, workCanvas.width, workCanvas.height, bgColor, textColor);
      drawTime(durationSec, bgColor, textColor);
      const lastFrame = new VideoFrame(workCanvas, { timestamp: dynamicFrameCount * frameDurationUs, duration: frameDurationUs });
      encoder.encode(lastFrame);
      lastFrame.close();

      await encoder.flush();
      encoder.close();
      muxer.finalize();

      const webmBuffer = muxer.target.buffer;
      return new Blob([webmBuffer], { type: 'video/webm' });
    }

    bgColorInput.addEventListener('input', () => { if (!busy) drawTime(0, bgColorInput.value, textColorInput.value); });
    textColorInput.addEventListener('input', () => { if (!busy) drawTime(0, bgColorInput.value, textColorInput.value); });

    let busy = false;
    startBtn.addEventListener('click', async () => {
      if (busy) return;
      const durationSec = parseDurationInput(secondsInput.value);
      const fps = Number.parseInt(fpsSelect.value, 10);
      const tickStepSec = Number.parseFloat(tickSelect.value);
      const bgColor = bgColorInput.value;
      const textColor = textColorInput.value;
      if (!Number.isFinite(durationSec) || durationSec <= 0 || ![30, 60].includes(fps) || ![0.01, 0.1, 1, 10].includes(tickStepSec)) {
        alert('時間を入力してください（例: 70.24 または 1:10.24）');
        return;
      }

      busy = true;
      startBtn.classList.add('running');
      startBtn.textContent = '生成中...';
      statusEl.textContent = '開始しました。準備中...';
      await new Promise((r) => requestAnimationFrame(r));
      startBtn.disabled = true;

      try {
        const blob = await generateWebM(durationSec, fps, tickStepSec, bgColor, textColor);
        const fileName = `stopwatch_${durationSec.toFixed(2)}s_${fps}fps_step${tickStepSec}s.webm`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = `完了: ${fileName} をダウンロードしました`;
      } catch (e) {
        console.error(e);
        statusEl.textContent = `エラー: ${e.message || e}`;
      } finally {
        busy = false;
        startBtn.disabled = false;
        startBtn.classList.remove('running');
        startBtn.textContent = 'スタート';
      }
    });
  </script>
</body>
</html>
