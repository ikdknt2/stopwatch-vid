<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ストップウォッチ動画生成（高速オフライン）</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: ui-monospace, monospace; }
    .wrap { width: min(92vw, 960px); display: grid; gap: 14px; justify-items: center; }
    .usage { width: 100%; max-width: 960px; font-size: 14px; line-height: 1.6; color: #d0d7de; background: #0d1117; border: 1px solid #222; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; }
    .usage h2 { margin: 0 0 8px; font-size: 16px; color: #fff; }
    .usage ul { margin: 0; padding-left: 1.2em; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    input, select, button { font-family: inherit; font-size: 16px; border-radius: 8px; border: 1px solid #666; background: #111; color: #fff; padding: 8px 10px; }
    input[type="text"] { width: 190px; }
    input[type="color"] { width: 54px; height: 40px; padding: 4px; }
    #startBtn:active { background: #3fb950; border-color: #56d364; }
    #startBtn.running { background: #2ea043; border-color: #56d364; box-shadow: 0 0 0 3px rgba(46, 160, 67, .35); }
    canvas { width: 100%; max-width: 960px; aspect-ratio: 16/9; border: 1px solid #222; background: #000; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <label for="secondsInput">秒数:</label>
      <input id="secondsInput" type="text" value="12.34" placeholder="例: 70.24 / 1:10.24" />
      <label for="fpsSelect">FPS:</label>
      <select id="fpsSelect">
        <option value="60">60</option>
        <option value="30">30</option>
      </select>
      <label for="tickSelect">更新刻み:</label>
      <select id="tickSelect">
        <option value="0.01">0.01秒</option>
        <option value="0.1">0.1秒</option>
        <option value="1">1秒</option>
        <option value="10">10秒</option>
      </select>
      <label for="bgColorInput">背景:</label>
      <input id="bgColorInput" type="color" value="#000000" />
      <label for="textColorInput">文字:</label>
      <input id="textColorInput" type="color" value="#ffffff" />
      <label for="formatSelect">形式:</label>
      <select id="formatSelect">
        <option value="mp4">MP4 (H.264)</option>
        <option value="webm">WebM (VP9)</option>
      </select>
      <label for="engineSelect">生成方式:</label>
      <select id="engineSelect">
        <option value="webcodecs">WebCodecs</option>
        <option value="mediarecorder">MediaRecorder</option>
      </select>
      <button id="startBtn">スタート</button>
    </div>
    <div id="status">待機中</div>
    <canvas id="timerCanvas" width="1280" height="720"></canvas>

    <section class="usage" aria-label="使い方">
      <h2>使い方</h2>
      <ul>
        <li>秒数に時間を入力します（例: <code>12.34</code> / <code>1:10.24</code>）。</li>
        <li>更新刻みを選ぶと、表示の変化タイミングを調整できます。</li>
        <li>背景色・文字色を選んで見た目を調整します。</li>
        <li>スタートを押すと選択した形式（MP4 / WebM）と生成方式（WebCodecs / MediaRecorder）で動画を生成し、自動でダウンロードします。</li>
        <li>長時間を生成すると、端末のスペックによってはフリーズのような動作が発生する危険性があります。</li>
        <li>はじめは少しずつ時間を増やしながら使用してください。</li>
      </ul>
    </section>
  </div>

  <script type="module">
    import { Muxer as WebMMuxer, ArrayBufferTarget as WebMArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/webm-muxer@5.1.4/+esm';
    import { Muxer as MP4Muxer, ArrayBufferTarget as MP4ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm';

    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const secondsInput = document.getElementById('secondsInput');
    const startBtn = document.getElementById('startBtn');
    const fpsSelect = document.getElementById('fpsSelect');
    const tickSelect = document.getElementById('tickSelect');
    const bgColorInput = document.getElementById('bgColorInput');
    const textColorInput = document.getElementById('textColorInput');
    const statusEl = document.getElementById('status');
    const formatSelect = document.getElementById('formatSelect');
    const engineSelect = document.getElementById('engineSelect');

    const workCanvas = document.createElement('canvas');
    workCanvas.width = canvas.width;
    workCanvas.height = canvas.height;
    const workCtx = workCanvas.getContext('2d', { alpha: false });

    function formatTime(seconds) {
      const cs = Math.floor(Math.max(0, seconds) * 100 + 1e-6);
      const m = Math.floor(cs / 6000);
      const s = Math.floor((cs % 6000) / 100);
      const c = cs % 100;
      return `${m}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
    }

    function drawTimeOn(targetCtx, seconds, w, h, bgColor, textColor) {
      targetCtx.fillStyle = bgColor;
      targetCtx.fillRect(0, 0, w, h);
      targetCtx.fillStyle = textColor;
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.font = 'bold 180px ui-monospace, monospace';
      targetCtx.fillText(formatTime(seconds), w / 2, h / 2);
    }

    function drawTime(seconds, bgColor, textColor) {
      drawTimeOn(ctx, seconds, canvas.width, canvas.height, bgColor, textColor);
    }
    drawTime(0, bgColorInput.value, textColorInput.value);


    function parseDurationInput(raw) {
      const text = String(raw || '').trim();
      if (!text) return NaN;

      // m:ss.cc 形式（例: 1:10.24）
      if (text.includes(':')) {
        const [mPart, sPart] = text.split(':');
        if (sPart === undefined) return NaN;
        const minutes = Number.parseInt(mPart, 10);
        const seconds = Number.parseFloat(sPart);
        if (!Number.isFinite(minutes) || minutes < 0 || !Number.isFinite(seconds) || seconds < 0 || seconds >= 60) return NaN;
        return minutes * 60 + seconds;
      }

      // 秒のみ（例: 70.24）
      return Number.parseFloat(text);
    }


    function syncFpsOptionsByTickStep() {
      const tick = Number.parseFloat(tickSelect.value);
      const allow60 = tick === 0.01;
      const option60 = fpsSelect.querySelector('option[value="60"]');

      if (allow60) {
        if (!option60) {
          const op = document.createElement('option');
          op.value = '60';
          op.textContent = '60';
          fpsSelect.insertBefore(op, fpsSelect.firstChild);
        }
      } else {
        if (option60) option60.remove();
        fpsSelect.value = '30';
      }
    }

    function quantizeTime(seconds, stepSec) {
      if (!Number.isFinite(stepSec) || stepSec <= 0) return seconds;
      return Math.floor(seconds / stepSec) * stepSec;
    }


    function pickMediaRecorderMimeType(format) {
      if (!('MediaRecorder' in window)) return null;
      const candidates = format === 'mp4'
        ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E', 'video/mp4']
        : ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      return candidates.find((t) => MediaRecorder.isTypeSupported(t)) || null;
    }

    async function generateVideoWithMediaRecorder(durationSec, fps, tickStepSec, bgColor, textColor, format) {
      if (!('MediaRecorder' in window)) throw new Error('このブラウザはMediaRecorder未対応です');
      const mimeType = pickMediaRecorderMimeType(format);
      if (!mimeType) throw new Error(`MediaRecorderで${format.toUpperCase()}を生成できません`);

      const stream = workCanvas.captureStream(fps);
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

      const totalFrames = Math.max(0, Math.floor(durationSec * fps)) + 1;
      statusEl.textContent = `録画準備中... 0/${totalFrames}`;
      recorder.start();

      for (let i = 0; i < totalFrames; i += 1) {
        const t = i === totalFrames - 1 ? durationSec : quantizeTime(i / fps, tickStepSec);
        drawTimeOn(workCtx, t, workCanvas.width, workCanvas.height, bgColor, textColor);
        drawTime(t, bgColor, textColor);
        statusEl.textContent = `録画中... ${i + 1}/${totalFrames}`;
        await new Promise((r) => setTimeout(r, Math.max(0, Math.round(1000 / fps))));
      }

      const done = new Promise((resolve) => { recorder.onstop = resolve; });
      recorder.stop();
      await done;
      stream.getTracks().forEach((track) => track.stop());

      return new Blob(chunks, { type: mimeType.split(';')[0] || (format === 'mp4' ? 'video/mp4' : 'video/webm') });
    }

    async function generateVideo(durationSec, fps, tickStepSec, bgColor, textColor, format) {
      if (!('VideoEncoder' in window) || !('VideoFrame' in window)) {
        throw new Error('このブラウザはWebCodecs未対応です（最新Chrome推奨）');
      }

      const dynamicFrameCount = Math.max(0, Math.floor(durationSec * fps));
      const totalFrames = dynamicFrameCount + 1;
      const frameDurationUs = Math.round(1_000_000 / fps);

      const isMp4 = format === 'mp4';
      const muxer = isMp4
        ? new MP4Muxer({
            target: new MP4ArrayBufferTarget(),
            video: {
              codec: 'avc',
              width: workCanvas.width,
              height: workCanvas.height,
              frameRate: fps
            },
            fastStart: 'in-memory'
          })
        : new WebMMuxer({
            target: new WebMArrayBufferTarget(),
            video: {
              codec: 'V_VP9',
              width: workCanvas.width,
              height: workCanvas.height,
              frameRate: fps
            }
          });

      let encodedCount = 0;
      const encoder = new VideoEncoder({
        output: (chunk, meta) => {
          muxer.addVideoChunk(chunk, meta);
          encodedCount += 1;
          if (encodedCount % 30 === 0 || encodedCount === totalFrames) {
            statusEl.textContent = `エンコード中... ${encodedCount}/${totalFrames}`;
          }
        },
        error: (e) => { throw e; }
      });

      encoder.configure({
        codec: isMp4 ? 'avc1.42001f' : 'vp09.00.10.08',
        width: workCanvas.width,
        height: workCanvas.height,
        bitrate: 8_000_000,
        framerate: fps
      });

      statusEl.textContent = `フレーム生成中... 0/${totalFrames}`;
      const t0 = performance.now();

      for (let i = 0; i < dynamicFrameCount; i += 1) {
        const t = i / fps;
        const shownTime = quantizeTime(t, tickStepSec);
        drawTimeOn(workCtx, shownTime, workCanvas.width, workCanvas.height, bgColor, textColor);
        const vf = new VideoFrame(workCanvas, { timestamp: i * frameDurationUs, duration: frameDurationUs });
        encoder.encode(vf);
        vf.close();

        if ((i + 1) % 60 === 0 || i + 1 === dynamicFrameCount) {
          const elapsed = (performance.now() - t0) / 1000;
          const speed = ((i + 1) / (elapsed || 1)).toFixed(1);
          statusEl.textContent = `フレーム生成中... ${i + 1}/${totalFrames} (${speed}fps相当)`;
          await new Promise((r) => setTimeout(r, 0));
        }
      }

      drawTimeOn(workCtx, durationSec, workCanvas.width, workCanvas.height, bgColor, textColor);
      drawTime(durationSec, bgColor, textColor);
      const lastFrame = new VideoFrame(workCanvas, { timestamp: dynamicFrameCount * frameDurationUs, duration: frameDurationUs });
      encoder.encode(lastFrame);
      lastFrame.close();

      await encoder.flush();
      encoder.close();
      muxer.finalize();

      const videoBuffer = muxer.target.buffer;
      return new Blob([videoBuffer], { type: isMp4 ? 'video/mp4' : 'video/webm' });
    }

    bgColorInput.addEventListener('input', () => { if (!busy) drawTime(0, bgColorInput.value, textColorInput.value); });
    textColorInput.addEventListener('input', () => { if (!busy) drawTime(0, bgColorInput.value, textColorInput.value); });
    tickSelect.addEventListener('change', syncFpsOptionsByTickStep);
    syncFpsOptionsByTickStep();

    let busy = false;
    startBtn.addEventListener('click', async () => {
      if (busy) return;
      const durationSec = parseDurationInput(secondsInput.value);
      const fps = Number.parseInt(fpsSelect.value, 10);
      const tickStepSec = Number.parseFloat(tickSelect.value);
      const bgColor = bgColorInput.value;
      const textColor = textColorInput.value;
      const format = formatSelect.value;
      const engine = engineSelect.value;
      const validFps = tickStepSec === 0.01 ? [30, 60] : [30];
      if (!Number.isFinite(durationSec) || durationSec <= 0 || !validFps.includes(fps) || ![0.01, 0.1, 1, 10].includes(tickStepSec)) {
        alert('時間を入力してください（例: 70.24 または 1:10.24）');
        return;
      }

      busy = true;
      startBtn.classList.add('running');
      startBtn.textContent = '生成中...';
      statusEl.textContent = '開始しました。準備中...';
      await new Promise((r) => requestAnimationFrame(r));
      startBtn.disabled = true;

      try {
        const blob = engine === 'mediarecorder'
          ? await generateVideoWithMediaRecorder(durationSec, fps, tickStepSec, bgColor, textColor, format)
          : await generateVideo(durationSec, fps, tickStepSec, bgColor, textColor, format);
        const ext = format === 'mp4' ? 'mp4' : 'webm';
        const fileName = `stopwatch_${durationSec.toFixed(2)}s_${fps}fps_step${tickStepSec}s_${engine}.${ext}`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        statusEl.textContent = `完了: ${fileName} をダウンロードしました`;
      } catch (e) {
        console.error(e);
        statusEl.textContent = `エラー: ${e.message || e}`;
      } finally {
        busy = false;
        startBtn.disabled = false;
        startBtn.classList.remove('running');
        startBtn.textContent = 'スタート';
      }
    });
  </script>
</body>
</html>
